<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatchat · 网站原型</title>
<!--
  原型：三种网站布局，用 ?variant=A|B|C 切换，默认 A。2026-10-26 选定 A，B、C 作为落选变体保留。
  A 工作台（选定）：左侧 chat 列表 + 中间消息 + 右侧摘要与参与者
  B 阅读（落选）：单栏 760px，摘要置顶，摘要已覆盖的消息默认折叠
  C 时间线（落选）：消息带序号，历次摘要嵌在它覆盖到的位置，右侧抽屉
  地址形如 web.html?variant=B#/c/<chat_id>~pending,dark：# 后是页面，~ 后是要直接打开的状态，可组合。
  右下角「状态」菜单列出全部页面与状态，点一项跳过去并重新加载；也能切换布局、暗色，模拟实时事件。
  菜单是原型专用，不属于设计。数据都在内存里，刷新即复位。
-->
<style>
:root {
  /* 视觉 token 取自参考图（Slack 新版）：浅灰外框上浮着白色圆角面板，消息平铺不用气泡，
     名字加粗，头像圆角方形，紫色只做选中和强调，主操作用近黑色 */
  color-scheme: light;
  --bg: #f3f3f4;
  --surface: #ffffff;
  --ink: #1d1c1d;
  --ink-2: #616061;
  --ink-3: #9a999c;
  --line: #e8e8e9;
  --hover: #f8f8f8;
  --selected: #f1f1f2;
  --chip: #f1f1f2;
  --accent: #9b51e0;
  --accent-soft: #f4ebfc;
  --link: #1264a3;
  --primary: #1d1c1d;
  --primary-hover: #3a393b;
  --on-primary: #ffffff;
  --danger: #e01e5a;
  --danger-soft: #fdecf1;
  --online: #2bac76;
  --summary: color-mix(in oklch, var(--accent) 5%, #fff);
  --summary-line: color-mix(in oklch, var(--accent) 20%, var(--line));
  /* 形状 token 按印象中的 claude.ai：0.5px 半透明细线、大而淡的阴影、输入卡 20px 圆角、按钮 8px */
  --hairline: color-mix(in oklch, var(--ink) 15%, transparent);
  --hairline-strong: color-mix(in oklch, var(--ink) 28%, transparent);
  --app-max: 1440px;   /* 网站主体最大宽度，宽屏上居中 */
  --radius-lg: 20px;
  --radius-panel: 16px;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.04);
  --shadow-panel: 0 0.25rem 1.25rem rgb(0 0 0 / 0.035);
  --shadow-input: 0 0.25rem 1.25rem rgb(0 0 0 / 0.035);
  --shadow-input-hover: 0 0.25rem 1.25rem rgb(0 0 0 / 0.075);
  --shadow-md: 0 0.25rem 1.25rem rgb(0 0 0 / 0.08);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121214;
  --surface: #1c1c1f;
  --ink: #e8e8ea;
  --ink-2: #a3a3a8;
  --ink-3: #6e6e74;
  --line: #2c2c30;
  --hover: #232327;
  --selected: #2a2a2e;
  --chip: #2a2a2e;
  --accent: #b47ef0;
  --accent-soft: #2e2440;
  --link: #4ea3e8;
  --primary: #e8e8ea;
  --primary-hover: #ffffff;
  --on-primary: #1c1c1f;
  --danger: #f2557f;
  --danger-soft: #3a1f29;
  --online: #3cc48c;
  --summary: color-mix(in oklch, var(--accent) 8%, var(--surface));
  --summary-line: color-mix(in oklch, var(--accent) 26%, var(--line));
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-panel: 0 0.25rem 1.25rem rgb(0 0 0 / 0.25);
  --shadow-input: 0 0.25rem 1.25rem rgb(0 0 0 / 0.3);
  --shadow-input-hover: 0 0.25rem 1.25rem rgb(0 0 0 / 0.45);
  --shadow-md: 0 0.25rem 1.25rem rgb(0 0 0 / 0.5);
}
* { box-sizing: border-box; }
/* 滚动条：平时隐藏，滚动时显示最细的一条，停止 800ms 后再隐藏（JS 在滚动的元素上加 .scrolling）。
   Chrome/Safari 用 ::-webkit-scrollbar 做到 4px；Firefox 只支持 thin，用标准属性。 */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
.scrolling::-webkit-scrollbar-thumb { background: var(--hairline-strong); }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .scrolling { scrollbar-color: var(--hairline-strong) transparent; }
}
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: var(--radius-sm); font-weight: 500; font-size: 14px;
  border: 0.5px solid var(--hairline-strong); background: transparent; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--hover); border-color: var(--hairline-strong); }
.btn:active, .icon-btn:active { transform: scale(0.985); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.danger { color: var(--danger); }
.btn.danger-fill { background: var(--danger); border-color: transparent; color: #fff; }
.btn.danger-fill:hover { background: color-mix(in oklch, var(--danger), #000 12%); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13.5px; }
.btn[disabled] { opacity: .45; cursor: default; }
.icon-btn {
  width: 32px; height: 32px; display: inline-grid; place-items: center;
  border: 0; background: transparent; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-2);
  transition: background-color .15s, transform .1s;
}
.icon-btn:hover { background: var(--selected); color: var(--ink); }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 输入 */
.field {
  width: 100%; border: 0.5px solid var(--hairline-strong); background: var(--surface);
  border-radius: 10px; padding: 8px 12px; transition: border-color .15s;
}
.field:hover { border-color: color-mix(in oklch, var(--ink) 40%, transparent); }
.field:focus { border-color: color-mix(in oklch, var(--ink) 55%, transparent); }
textarea { resize: none; }
label.lbl { display: block; font-size: 13px; color: var(--ink-2); margin: 12px 0 4px; }

/* 状态点与标签 */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.online { background: var(--online); }
.dot.offline { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.dot.left { background: var(--line); }
.tag {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px;
  background: var(--chip); color: var(--ink-2); font-size: 11.5px; font-weight: 500;
}
.sid { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

/* 头像 */
.av {
  width: 36px; height: 36px; border-radius: 9px; flex: none;
  display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #2b2b2e;
}
.av.sm { width: 24px; height: 24px; font-size: 11px; border-radius: 6px; }

/* 消息正文 */
.md p { margin: 0 0 6px; }
.md p:last-child { margin-bottom: 0; }
.md ul { margin: 2px 0 6px; padding-left: 20px; }
.md code { font-family: var(--mono); font-size: 13px; color: var(--danger); background: var(--chip); border: 0.5px solid var(--hairline); padding: 0 4px; border-radius: 4px; }
.md h4 { margin: 12px 0 4px; font-size: 13px; }
.md h4:first-child { margin-top: 0; }
.sysmsg { color: var(--ink-3); font-size: 12.5px; }

/* 浮层菜单 */
.pop {
  position: fixed; z-index: 40; min-width: 200px; padding: 6px;
  background: var(--surface); border: 0.5px solid var(--hairline); border-radius: var(--radius); box-shadow: var(--shadow-md);
}
.pop .item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: transparent;
  border-radius: var(--radius-sm); cursor: pointer; text-align: left;
}
.pop .item:hover { background: var(--selected); }
.pop .item.danger { color: var(--danger); }
.pop .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop .head { padding: 6px 10px 2px; font-size: 12px; color: var(--ink-3); }

/* 对话框 */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 0.3); display: grid; place-items: center; }
:root[data-theme="dark"] .scrim { background: rgb(0 0 0 / 0.5); }
.dialog {
  width: min(480px, calc(100vw - 32px)); background: var(--surface); border-radius: var(--radius-panel); border: 0.5px solid var(--hairline);
  box-shadow: var(--shadow-md); padding: 24px;
}
.dialog h3 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.secret-box {
  display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 0.5px solid var(--hairline);
  background: var(--chip); font-family: var(--mono); font-size: 12.5px; word-break: break-all;
}
.secret-box span { flex: 1; }

/* 提示 */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%);
  z-index: 60; width: max-content; max-width: 280px; padding: 6px 10px; border-radius: var(--radius-sm);
  background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.5; font-weight: 400; white-space: pre-line; pointer-events: none;
}
[data-tip].tip-up:hover::after { top: auto; bottom: calc(100% + 6px); }
[data-tip].tip-left:hover::after { left: auto; right: 0; transform: none; }
.toast {
  position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 70;
  background: var(--surface); color: var(--ink); border: 0.5px solid var(--hairline); padding: 9px 14px; border-radius: var(--radius); font-size: 13.5px; box-shadow: var(--shadow-md);
}

/* 摘要卡（三个变体共用的配色） */
.summary { background: var(--summary); border: 0.5px solid var(--summary-line); border-radius: var(--radius); }
.summary .s-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.summary .s-head b { color: var(--ink); font-weight: 600; font-size: 13px; }
.pending { display: inline-flex; align-items: center; gap: 6px; }
.pending::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* 生命周期说明行 */
.life { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.life span { display: inline-flex; align-items: center; gap: 5px; cursor: help; }

/* ================= A 工作台 ================= */
.va { display: grid; grid-template-columns: 260px 1fr; height: 100vh; padding: 8px 8px 8px 0; gap: 0; max-width: var(--app-max); margin: 0 auto; }
.va.with-panel { grid-template-columns: 260px 1fr 320px; }
.va .side { display: flex; flex-direction: column; min-height: 0; }
.va .brand { display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px; font-weight: 700; letter-spacing: -.01em; }
.va .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; }
.va .side .new { margin: 4px 12px 12px; justify-content: center; }
.va .side nav { flex: 1; overflow: auto; padding: 0 8px; }
.va .grp { font-size: 12px; color: var(--ink-3); padding: 12px 8px 4px; }
.va .row {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-sm); cursor: pointer;
}
.va .row:hover { background: color-mix(in oklch, var(--bg), var(--ink) 4%); }
.va .row.cur { background: color-mix(in oklch, var(--bg), var(--ink) 7%); font-weight: 600; }
.va .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.va .row.gone .t { color: var(--ink-3); }
.va .row .n { font-size: 12px; color: var(--ink-3); }
.va .me { display: flex; align-items: center; gap: 8px; margin: 8px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; }
.va .me:hover { background: color-mix(in oklch, var(--bg), var(--ink) 4%); }
.va main { margin-left: 24px; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); border-radius: var(--radius-panel); border: 0.5px solid var(--hairline); box-shadow: var(--shadow-panel); }
.va.with-panel main { border-radius: var(--radius-panel) 0 0 var(--radius-panel); border-right: 0; }
.va .bar { display: flex; align-items: center; gap: 10px; height: 72px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--line); flex: none; }
.va .bar h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.va .stream { flex: 1; overflow: auto; padding: 20px 24px; }
.va .msg { display: flex; gap: 12px; padding: 8px 0; max-width: 820px; }
.va .msg .md, .vb .msg .md { color: var(--ink); }
.va .msg .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 1px; }
.va .msg .who .faint { font-size: 13px; }
.va .msg .who b { font-weight: 700; }
.va .msg .body { min-width: 0; flex: 1; }
.va .msg.cont { padding-top: 0; }
.va .msg.cont .av { visibility: hidden; height: 0; }
.va .msg:hover, .vb .msg:hover { background: var(--hover); }
.va .msg { margin: 0 -24px; padding-left: 24px; padding-right: 24px; }
.va .sys { padding: 6px 0 6px 48px; }
.va .composer { padding: 12px 24px 20px; flex: none; }
.va .composer .box, .vb .composer .box, .vc .composer .box { border: 0.5px solid var(--hairline-strong) !important; border-radius: var(--radius-lg) !important; box-shadow: var(--shadow-input) !important; transition: box-shadow .2s; }
.va .composer .box:hover, .vb .composer .box:hover, .vc .composer .box:hover, .va .composer .box:focus-within, .vb .composer .box:focus-within, .vc .composer .box:focus-within { box-shadow: var(--shadow-input-hover) !important; }
.va .composer .box { max-width: 820px; background: var(--surface); padding: 14px 14px 10px 16px; }
.va .composer textarea { border: 0; width: 100%; background: transparent; padding: 0; min-height: 44px; }
.va .composer .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.va .panel { border: 0.5px solid var(--hairline); overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 0; background: var(--surface); border-radius: 0 var(--radius-panel) var(--radius-panel) 0; box-shadow: var(--shadow-panel); }
.va .panel section { padding: 18px 0; border-bottom: 1px solid var(--line); }
.va .panel section:first-child { padding-top: 4px; }
.va .panel section:last-child { border-bottom: 0; }
.va .panel h5 { margin: 0 0 10px; font-size: 15px; color: var(--ink); font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
.va .panel .summary { padding: 12px 14px; }
.va .panel .summary .md { margin-top: 8px; font-size: 13px; }
.va .people .p { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.va .people .p .nm { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
.va .people .p.left .nm b { color: var(--ink-3); font-weight: 400; }
.va .home { flex: 1; display: grid; place-items: center; padding: 24px; background: var(--surface); border-radius: var(--radius-panel); border: 0.5px solid var(--hairline); box-shadow: var(--shadow-panel); }
.va .create { width: min(440px, 100%); }
.va .create h2 { margin: 0 0 16px; font-size: 22px; font-weight: 800; }

/* ================= B 阅读 ================= */
.vb .top { position: sticky; top: 0; z-index: 10; background: var(--bg); }
.vb .top .in { max-width: 800px; margin: 0 auto; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 20px; }
.vb .top .brand { font-weight: 800; letter-spacing: -.01em; }
.vb .top nav { display: flex; gap: 2px; flex: 1; }
.vb .top nav a { padding: 5px 10px; border-radius: var(--radius-sm); color: var(--ink-2); }
.vb .top nav a:hover { background: var(--hover); color: var(--ink); }
.vb .top nav a.cur { color: var(--ink); background: color-mix(in oklch, var(--bg), var(--ink) 7%); font-weight: 600; }
.vb .col { max-width: 800px; margin: 16px auto 0; padding: 32px 40px 160px; background: var(--surface); border-radius: var(--radius-panel) var(--radius-panel) 0 0; border: 0.5px solid var(--hairline); border-bottom: 0; box-shadow: var(--shadow-panel); min-height: calc(100vh - 80px); }
.vb h1 { font-size: 26px; font-weight: 800; letter-spacing: -.015em; margin: 0 0 6px; line-height: 1.3; }
.vb .goal { color: var(--ink-2); margin: 0 0 12px; }
.vb .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.vb .faces { display: inline-flex; align-items: center; padding: 3px 8px 3px 4px; border-radius: 999px; border: 0.5px solid var(--hairline-strong); background: var(--surface); cursor: pointer; gap: 6px; }
.vb .faces:hover { background: color-mix(in oklch, var(--surface), var(--ink) 4%); }
.vb .faces .stack { display: inline-flex; }
.vb .faces .stack .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); }
.vb .faces .stack .av:first-child { margin-left: 0; }
.vb .meta .grow { flex: 1; }
.vb .summary { padding: 16px 18px; margin-bottom: 8px; }
.vb .summary .md { margin-top: 10px; }
.vb .summary.collapsed .md { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vb .fold {
  display: flex; align-items: center; gap: 0; margin: 18px 0; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer;
}
.vb .fold > span { padding: 3px 12px; border: 0.5px solid var(--hairline-strong); border-radius: 999px; background: var(--surface); }
.vb .fold:hover > span { background: var(--hover); }
.vb .fold::before, .vb .fold::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.vb .msg .who { display: flex; align-items: center; gap: 10px; margin-bottom: 0; }
.vb .msg .who .faint { font-size: 13px; }
.vb .msg .who b { font-weight: 700; }
.vb .msg .md { margin-left: 34px; }
.vb .msg { margin: 0 -16px; padding: 8px 16px; border-radius: var(--radius-sm); }
.vb .sys { padding: 4px 0 4px 34px; }
.vb .covered { opacity: .72; }
.vb .composer { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 20px 72px; pointer-events: none; }
.vb .composer .box {
  pointer-events: auto; max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 8px 8px 16px; box-shadow: var(--shadow-md);
}
.vb .composer textarea { flex: 1; border: 0; background: transparent; padding: 5px 0; min-height: 30px; max-height: 160px; }
.vb .list .item {
  display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
}
.vb .list .item:hover { background: var(--hover); }
.vb .list .item { margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
.vb .list .item .t { flex: 1; min-width: 0; }
.vb .list .item .t b { display: block; font-weight: 700; }
.vb .list .item .t span { font-size: 12.5px; color: var(--ink-2); }
.vb .list .item.gone b { color: var(--ink-3); font-weight: 500; }
.vb .newbar { display: flex; gap: 8px; margin: 8px 0 28px; }
.vb h6 { font-size: 12px; color: var(--ink-3); font-weight: 500; margin: 28px 0 4px; }

/* ================= C 时间线 ================= */
.vc { display: grid; grid-template-rows: auto 1fr; height: 100vh; padding: 0 8px 8px; max-width: var(--app-max); margin: 0 auto; }
.vc .top { display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 8px 0 12px; }
.vc .top .brand { font-weight: 800; }
.vc .top .crumb { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 13px; }

/* ---------------- 工具 ---------------- */

function route() {

    <div class="cfg"># ~/.config/chatchat/config.yaml
server: https://chatchat.onlyquant.top

function destroyedPage(c) {

/* ---------------- A 工作台 ---------------- */
function A(r) {
  const cur = r.chat;

  const side = `<aside class="side">

    <a class="btn new" href="#/new">${icon('plus')}新建 chat</a>
    <nav>
      <div class="grp">进行中</div>
      ${active.map(c => `<a class="row ${cur === c ? 'cur' : ''}" href="#/c/${c.id}"><span class="dot ${online(c) ? 'online' : 'offline'}"></span><span class="t">${esc(c.title)}</span><span class="n num">${online(c)}/${c.participants.filter(p => p.status !== 'left').length}</span></a>`).join('')}
      <div class="grp">已销毁</div>
      ${gone.map(c => `<a class="row gone" href="#/c/${c.id}"><span class="dot left"></span><span class="t">${esc(c.title)}</span></a>`).join('')}
    </nav>
    <div class="me" data-act="user-menu">${av({ id: 'u1', kind: 'web', name: ME.name }, 'sm')}<span style="flex:1">${ME.name}</span></div>

  if (!cur) {
    return `<div class="va">${side}<main style="background:none;box-shadow:none"><div class="home"><div class="create"><h2>新建 chat</h2>${createForm()}</div></div></main></div>`;
  }
  const s = latest(cur);
  let prev = null;
  const stream = cur.messages.map(m => {
    if (m.kind === 'system') { prev = null; return `<div class="sys sysmsg">${esc(m.name)} ${sid(pOf(cur, m.pid))} ${esc(m.text)} · ${m.time}</div>`; }
    const p = pOf(cur, m.pid), cont = prev === m.pid; prev = m.pid;
    return `<div class="msg ${cont ? 'cont' : ''} ${p.mine ? 'mine' : ''}">${av(p)}<div class="body">${cont ? '' : `<div class="who"><b>${esc(p.name)}</b>${p.kind === 'cli' ? sid(p) : ''}<span class="faint">${m.time}</span><span class="faint mono">#${m.seq}</span></div>`}<div class="md">${md(m.text)}</div></div></div>`;
  }).join('');
  const panel = `<aside class="panel">
    <section>
      <h5><span data-tip="${summaryTip}">摘要</span><span class="faint">r${s ? s.rev : 0}</span></h5>
      <div class="summary"><div class="s-head">${summaryMeta(cur, s)}</div>${s ? `<div class="md">${md(s.content)}</div>` : ''}</div>
    </section>
    <section class="people">
      <h5>参与者 <span class="faint num">${online(cur)} 在线</span></h5>
      ${cur.participants.map(p => `<div class="p ${p.status}">${av(p, 'sm')}<span class="nm"><b>${esc(p.name)}</b>${p.mine ? '<span class="faint">（我）</span>' : sid(p)}</span>${kindTag(p)}<span class="dot ${p.status} tip-left" data-tip="${statusTip[p.status]}"></span></div>`).join('')}

  return `<div class="va with-panel">${side}<main>
    <div class="bar"><h2>${esc(cur.title)}</h2>

/* ---------------- B 阅读 ---------------- */
function B(r) {
  const top = `<header class="top"><div class="in"><a class="brand" href="#/">chatchat</a>
    <nav><a href="#/" class="${r.page === 'home' ? 'cur' : ''}">我的 chat</a><a href="#/tokens">用户 token</a></nav>

  if (r.page === 'home') {
    const active = S.chats.filter(c => !c.destroyed), gone = S.chats.filter(c => c.destroyed);
    return `<div class="vb">${top}<div class="col">
      <form class="newbar" data-act="create-inline"><input class="field" name="title" placeholder="新 chat 的标题" required><button class="btn primary">创建</button></form>
      <div class="list">
        ${active.map(c => `<a class="item" href="#/c/${c.id}"><div class="t"><b>${esc(c.title)}</b><span>${online(c)} 人在线 · ${c.messages.length} 条消息 · ${esc(c.idleNote)}</span></div><span class="dot ${online(c) ? 'online' : 'offline'}"></span></a>`).join('')}

    return `<div class="msg ${p.mine ? 'mine' : ''}">

      <button class="btn sm" data-act="invite">${icon('link')}邀请</button>
      <span class="grow"></span>
      ${lifeLine(c)}
      <button class="icon-btn" data-act="more">${icon('more')}</button>
    </div>
    ${s ? `<div class="summary ${S.summaryOpen ? '' : 'collapsed'}">
      <div class="s-head"><b data-tip="${summaryTip}">摘要</b><span>r${s.rev} · ${summaryMeta(c, s)}</span><span style="flex:1"></span><button class="btn sm ghost" data-act="toggle-summary">${S.summaryOpen ? '收起' : '展开'}</button></div>
      <div class="md">${md(s.content)}</div></div>` : `<div class="summary" style="padding:12px 16px"><div class="s-head">${summaryMeta(c, null)}</div></div>`}
    ${before.length ? `<div class="fold" data-act="toggle-covered"><span>${S.showCovered ? '收起' : '显示'}摘要已覆盖的 ${before.length} 条消息</span></div>` : ''}
    ${S.showCovered ? `<div class="covered">${before.map(msgHTML).join('')}</div><div class="fold" style="cursor:default"><span>摘要整理到这里</span></div>` : ''}
    <div id="after">${after.map(msgHTML).join('') || '<p class="faint" style="text-align:center">摘要之后还没有新消息</p>'}</div>
  </div>
  <div class="composer"><div class="box"><textarea id="draft" rows="1" placeholder="发消息">${esc(S.draft)}</textarea><button class="btn primary sm" data-act="send">${icon('send')}</button></div></div>
  </div>`;
}

/* ---------------- C 时间线 ---------------- */
function C(r) {
  const top = (crumb, right = '') => `<header class="top"><a class="brand" href="#/">chatchat</a><span class="faint">/</span><div class="crumb">${crumb}</div>${right}
    <span data-act="user-menu" style="cursor:pointer;margin-left:4px">${av({ id: 'u1', kind: 'web', name: ME.name }, 'sm')}</span></header>`;
  if (r.page === 'home') {
    const rows = S.chats.map(c => `<tr class="${c.destroyed ? 'gone' : ''}" data-href="#/c/${c.id}">
      <td><span class="dot ${c.destroyed ? 'left' : online(c) ? 'online' : 'offline'}"></span></td>
      <td>${esc(c.title)}</td>
      <td class="num">${c.destroyed ? '—' : `${online(c)}/${c.participants.filter(p => p.status !== 'left').length}`}</td>
      <td class="num mono">${c.destroyed ? '—' : '#' + c.messages.length}</td>
      <td class="num">${c.destroyed ? '—' : latest(c) ? 'r' + latest(c).rev + ' → #' + latest(c).covers : '—'}</td>
      <td>${c.destroyed ? REASON[c.destroyed.reason] : esc(c.idleNote)}</td>
      <td class="faint">${c.creator ? '我' : ''}</td></tr>`).join('');
    return `<div class="vc">${top('<b>我的 chat</b>', `<a class="btn sm ghost" href="#/tokens">${icon('key')}用户 token</a>`)}
      <div style="overflow:auto;background:var(--surface);border-radius:var(--radius-panel);border:0.5px solid var(--hairline);box-shadow:var(--shadow-panel)"><div class="dense">
        <div class="head"><h2>全部 chat</h2><a class="btn sm primary" href="#/new">${icon('plus')}新建</a></div>
        <table><thead><tr><th style="width:24px"></th><th>标题</th><th>在线</th><th>最新消息</th><th>摘要</th><th>生命周期</th><th>创建者</th></tr></thead><tbody>${rows}</tbody></table>
      </div></div>
      ${r.create ? `<div class="scrim" data-act="close-new"><div class="dialog"><h3>新建 chat</h3><div style="height:8px"></div>${createForm()}</div></div>` : ''}
    </div>`;
  }
  const c = r.chat;
  const snapsAt = {}; c.summaries.forEach(s => (snapsAt[s.covers] = snapsAt[s.covers] || []).push(s));
  const last = latest(c);
  let html = '';
  for (const m of c.messages) {
    const p = pOf(c, m.pid);
    html += m.kind === 'system'
      ? `<div class="line sys"><span class="seq">#${m.seq}</span><span class="from">${esc(p.name)} ${sid(p)}</span><div class="md">${esc(m.text)} · ${m.time}</div></div>`
      : `<div class="line"><span class="seq">#${m.seq}</span><span class="from">${av(p, 'sm')}<b>${esc(p.name)}</b>${p.kind === 'cli' ? sid(p) : ''}</span><div class="md">${md(m.text)}</div></div>`;
    for (const s of snapsAt[m.seq] || []) {
      const old = s !== last, open = S.openSnaps[s.rev];
      html += `<div class="summary snap ${old ? 'old' : ''} ${open ? 'open' : ''}" ${old ? `data-act="snap" data-rev="${s.rev}"` : ''}>
        <div class="s-head"><b>摘要 r${s.rev}</b><span>整理到 #${s.covers} · ${s.model} · ${s.time}</span>${old ? '<span class="faint" style="margin-left:auto">已被新摘要取代</span>' : `<span style="margin-left:auto">${S.summaryJob === 'pending' ? '<span class="pending">生成中</span>' : ''}</span>`}</div>
        <div class="md">${md(s.content)}</div></div>`;
    }
  }
  const tabs = { summary: '摘要', people: '参与者', info: '信息' };
  let pane = '';
  if (S.tab === 'summary') pane = last ? `<div class="summary" style="padding:12px 14px"><div class="s-head">r${last.rev} · ${summaryMeta(c, last)}</div><div class="md" style="margin-top:8px;font-size:13px">${md(last.content)}</div></div>` : '<p class="faint">还没有摘要</p>';
  if (S.tab === 'people') pane = c.participants.map(p => `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">${av(p, 'sm')}<span style="flex:1;min-width:0"><b style="font-weight:500">${esc(p.name)}</b> ${sid(p)}<br><span class="faint" style="font-size:12px">${p.joined || ''} 加入${p.left ? ' · ' + p.left + ' 退出' : ''}</span></span>${kindTag(p)}<span class="dot ${p.status} tip-left" data-tip="${statusTip[p.status]}"></span></div>`).join('');
  if (S.tab === 'info') pane = `<dl class="kv"><dt>ID</dt><dd class="mono">${c.id}</dd><dt>目标</dt><dd>${esc(c.goal || '—')}</dd><dt>创建</dt><dd>${c.created}${c.creator ? '（我）' : ''}</dd><dt>空闲销毁</dt><dd>${esc(c.idleNote)}</dd><dt>最迟销毁</dt><dd>${c.expires}</dd><dt>最新序号</dt><dd class="mono">#${c.messages.length}</dd></dl>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:8px">
      <button class="btn" data-act="copy-link">${icon('link')}复制 chat 链接</button>
      <button class="btn" data-act="copy-agent">${icon('bot')}复制给 Agent 的提示</button>
    </div>`;
  return `<div class="vc">${top(`<b>${esc(c.title)}</b><span class="faint num">${online(c)} 在线</span>`,
      `<button class="icon-btn" data-act="more">${icon('more')}</button><button class="icon-btn tip-left" data-act="panel" data-tip="${S.panel ? '收起侧栏' : '展开侧栏'}">${icon('panel')}</button>`)}
    <div class="body ${S.panel ? 'open' : ''}">
      <div class="stream" id="stream">${html}
        <div class="composer"><div class="box"><textarea id="draft" rows="1" placeholder="发消息，Enter 发送">${esc(S.draft)}</textarea><button class="btn sm primary" data-act="send">发送</button></div></div>
      </div>
      ${S.panel ? `<aside class="drawer"><div class="tabs">${Object.entries(tabs).map(([k, v]) => `<button class="${S.tab === k ? 'cur' : ''}" data-act="tab" data-tab="${k}">${v}</button>`).join('')}</div><div class="pane">${pane}</div></aside>` : ''}
    </div></div>`;
}

/* ---------------- 渲染 ---------------- */
const NAMES = { A: '工作台', B: '阅读（落选）', C: '时间线（落选）' };
function render(keepScroll) {
  const r = route();
  const st = $('#stream'), y = st ? st.scrollTop : 0;
  let html;
  if (r.page === 'tokens') html = tokensPage();
  else if (r.page === 'destroyed') html = destroyedPage(r.chat);
  else if (r.page === 'notfound') html = notFoundPage();
  else if (r.page === 'home' && r.create && S.variant === 'B') html = B({ page: 'home' });
  else html = { A, B, C }[S.variant](r);
  $('#app').innerHTML = html;
  const ns = $('#stream');
  if (ns) ns.scrollTop = keepScroll ? y : ns.scrollHeight;
  if (S.variant === 'B' && r.page === 'chat' && !keepScroll) scrollTo(0, document.body.scrollHeight);
}
function setVariant(v) {
  const u = new URL(location); u.searchParams.set('variant', v); location.href = u;
}

/* ---------------- 动作 ---------------- */
function current() { return route().chat; }
function addMessage(c, p, text) {
  c.messages.push({ seq: c.messages.length + 1, id: 'm_x', kind: 'text', pid: p.id, name: p.name, text, time: '刚刚' });
  const s = latest(c), n = c.messages.filter(m => m.kind === 'text' && m.seq > (s ? s.covers : 0)).length;
  if (n >= 20) runSummary(c);
}
function runSummary(c) {
  S.summaryJob = 'pending'; render(true);
  setTimeout(() => {
    S.summaryJob = 'idle';
    const s = latest(c), rev = s ? s.rev + 1 : 1;
    c.summaries.push({ rev, covers: c.messages.length, model: 'deepseek-flash', time: '刚刚', content: summaryText(3).replace('- 待定：谁写 `SessionStore`', '- Claude：写 `SessionStore` 和迁移，今天下午提 PR\n- Codex：Claude 的 PR 合并后改三处调用点').replace('- 实现任务尚未分配', '- 旧内存 session 是否迁移（Codex 倾向不迁）') });
    render(true);
  }, 1400);
}
function simulate(k) {
  const c = current();
  if (!c) { toast('先打开一个进行中的 chat'); return; }
  if (k === 'agent') { const who = c.participants.find(x => x.kind === 'cli' && x.status !== 'left') || c.participants[0]; who.status = 'online'; addMessage(c, who, '我看了最新消息，同意不迁移。PR 地址稍后贴。'); render(true); }
  if (k === 'summary') runSummary(c);
  if (k === 'agent-leave') {
    const who = c.participants.find(x => x.kind === 'cli' && x.status !== 'left');
    if (who) { who.status = 'left'; who.left = '刚刚'; c.messages.push({ seq: c.messages.length + 1, kind: 'system', pid: who.id, name: who.name, text: '退出了 chat', time: '刚刚' }); render(true); if (c.messages.some(m => m.kind === 'text' && m.seq > (latest(c)?.covers || 0))) runSummary(c); }
  }
  if (k === 'remote-destroy') { c.destroyed = { at: '刚刚', reason: 'creator' }; render(); }
}
document.addEventListener('click', e => {
  if (e.target.closest('.states, .states-btn')) return;
  const t = e.target.closest('[data-act]');
  const href = e.target.closest('[data-href]');
  if (!t && href) { go(href.dataset.href.slice(1)); return; }
  if (!t) { if (!e.target.closest('.pop')) closeLayer(); return; }
  const act = t.dataset.act, c = current();
  if (act === 'scrim') { if (e.target === t) closeLayer(); return; }
  if (act === 'close-new') { if (e.target === t) go('/'); return; }
  if (act === 'invite') return openPop(t, inviteMenu(c));
  if (act === 'more') return openPop(t, moreMenu(c));
  if (act === 'people') return openPop(t, `<div class="head">参与者</div>` + c.participants.map(p => `<div class="item" style="cursor:default">${av(p, 'sm')}<span style="flex:1">${esc(p.name)} ${p.mine ? '<span class="faint">（我）</span>' : sid(p)}</span>${kindTag(p)}<span class="dot ${p.status} tip-left" data-tip="${statusTip[p.status]}"></span></div>`).join(''), 'left');
  if (act === 'user-menu') return openPop(t, `<div class="head">${ME.email}</div><a class="item" href="#/tokens">${icon('key')}用户 token</a><div class="sep"></div><button class="item" data-act="logout">${icon('exit')}退出登录</button>`, S.variant === 'A' ? 'left' : 'right');
  if (act === 'copy-link') { closeLayer(); toast('已复制 chat 链接'); }
  if (act === 'copy-agent') { navigator.clipboard?.writeText(agentPrompt(c)); closeLayer(); toast('已复制给 Agent 的提示'); }
  if (act === 'logout') { closeLayer(); toast('原型：不模拟退出登录'); }
  if (act === 'propose-end') { c.messages.push({ seq: c.messages.length + 1, kind: 'system', pid: P.eric.id, name: P.eric.name, text: '建议结束这个 chat', time: '刚刚' }); closeLayer(); render(); }
  if (act === 'leave') dialog(`<h3>退出这个 chat？</h3><p class="muted">退出后仍可从链接重新进入，身份不变。</p><div class="actions"><button class="btn" data-act="cancel">取消</button><button class="btn primary" data-act="do-leave">退出</button></div>`);
  if (act === 'do-leave') { closeLayer(); P.eric.status = 'left'; toast('已退出'); go('/'); }
  if (act === 'destroy') dialog(`<h3>销毁「${esc(c.title)}」？</h3><p class="muted">删除全部消息和摘要，所有参与者的凭据立即失效。不能撤销。</p><div class="actions"><button class="btn" data-act="cancel">取消</button><button class="btn danger-fill" data-act="do-destroy">销毁</button></div>`);
  if (act === 'do-destroy') { c.destroyed = { at: '刚刚', reason: 'creator' }; closeLayer(); render(); }
  if (act === 'cancel') closeLayer();
  if (act === 'send') send();
  if (act === 'toggle-summary') { S.summaryOpen = !S.summaryOpen; render(true); }
  if (act === 'toggle-covered') { S.showCovered = !S.showCovered; render(true); }
  if (act === 'snap') { S.openSnaps[t.dataset.rev] = !S.openSnaps[t.dataset.rev]; render(true); }
  if (act === 'panel') { S.panel = !S.panel; render(true); }
  if (act === 'tab') { S.tab = t.dataset.tab; render(true); }
  if (act === 'new-token') dialog(`<h3>生成用户 token</h3><label class="lbl">名称</label><input class="field" id="tkname" placeholder="例如：MacBook"><div class="actions"><button class="btn" data-act="cancel">取消</button><button class="btn primary" data-act="do-token">生成</button></div>`);
  if (act === 'do-token') {
    const name = $('#tkname').value.trim() || '未命名';
    S.tokens.unshift({ id: 't_' + Date.now(), name, created: '刚刚', used: '从未' });
    dialog(`<h3>token 已生成</h3><p class="muted">只显示这一次，关闭后无法再查看。</p><div class="secret-box"><span>cct_Q8vN2kLx7pRm4TzY0aWcE3hJ6sUfB1dG</span><button class="icon-btn" data-act="copy-token">${icon('copy')}</button></div><div class="actions"><button class="btn primary" data-act="cancel-render">完成</button></div>`);
  }
  if (act === 'copy-token') toast('已复制');
  if (act === 'cancel-render') { closeLayer(); render(); }
  if (act === 'revoke') { const tk = S.tokens.find(x => x.id === t.dataset.id); dialog(`<h3>吊销「${esc(tk.name)}」？</h3><p class="muted">用这个 token 的 CLI 将无法再创建或加入 chat。已加入的参与者不受影响。</p><div class="actions"><button class="btn" data-act="cancel">取消</button><button class="btn danger-fill" data-act="do-revoke" data-id="${tk.id}">吊销</button></div>`); }
  if (act === 'do-revoke') { S.tokens = S.tokens.filter(x => x.id !== t.dataset.id); closeLayer(); render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const id = 'c_' + Math.random().toString(36).slice(2, 12);
  const me = Object.assign({}, P.eric, { status: 'online' });
  const c = makeChat({ id, title: f.get('title'), goal: f.get('goal') || '', creator: true, created: '刚刚', expires: '明天此时', idleNote: '有人在线', participants: [me] });
  c.messages.push({ seq: 1, kind: 'system', pid: me.id, name: me.name, text: '加入了 chat', time: '刚刚' });
  S.chats.unshift(c); go('/c/' + id);
});
function send() {
  const ta = $('#draft'), text = ta && ta.value.trim(); if (!text) return;
  const c = current(); S.draft = ''; addMessage(c, c.participants.find(p => p.mine) || P.eric, text); render();
}
document.addEventListener('keydown', e => {
  if (e.target.id === 'draft' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); return; }
  if (e.key === 'Escape') closeLayer();
});
document.addEventListener('input', e => { if (e.target.id === 'draft') S.draft = e.target.value; });
// 指针点击后不留焦点框
document.addEventListener('mousedown', e => { if (e.target.closest('button,a,[data-act]') && !e.target.closest('input,textarea')) e.preventDefault(); });
// 滚动时显示滚动条，停下 800ms 后隐藏
{
  const timers = new WeakMap();
  document.addEventListener('scroll', e => {
    const el = e.target === document ? document.documentElement : e.target;
    el.classList.add('scrolling');
    clearTimeout(timers.get(el));
    timers.set(el, setTimeout(() => el.classList.remove('scrolling'), 800));
  }, true);
}
addEventListener('hashchange', () => { closeLayer(); render(); });
const MAIN = '/c/c_7Hq2xV9pLm', SIDE = '/c/c_Zp04kWq8Rt';
if (!location.hash) history.replaceState(null, '', '#' + MAIN);
const flags = (location.hash.split('~')[1] || '').split(',').filter(Boolean);
const has = f => flags.includes(f);
if (has('dark')) document.documentElement.dataset.theme = 'dark';
if (has('pending')) S.summaryJob = 'pending';
if (has('failed')) S.summaryJob = 'failed';
if (has('nosummary')) chatById('c_7Hq2xV9pLm').summaries = [];
if (has('summary-open')) S.summaryOpen = true;
if (has('covered')) S.showCovered = true;
if (has('snap')) S.openSnaps[2] = true;
if (has('nopanel')) S.panel = false;
const tab = flags.find(f => f.startsWith('tab-')); if (tab) S.tab = tab.slice(4);
if (has('tokens-empty')) S.tokens = [];
if (has('draft')) S.draft = '我来写 `SessionStore` 和迁移';
render();
// 打开浮层类状态：模拟点击对应的触发按钮
const click = sel => { const el = $(sel); el && el.dispatchEvent(new MouseEvent('click', { bubbles: true })); };
for (const [f, sel] of [['invite', '[data-act=invite]'], ['more', '[data-act=more]'], ['people', '[data-act=people]'], ['user-menu', '[data-act=user-menu]'], ['new-token', '[data-act=new-token]'], ['revoke', '[data-act=revoke]']]) if (has(f)) click(sel);
for (const f of ['leave', 'destroy']) if (has(f)) { click('[data-act=more]'); click(`[data-act=${f}]`); }
if (has('token-shown')) { click('[data-act=new-token]'); $('#tkname').value = 'MacBook'; click('[data-act=do-token]'); }

// 原型专用：右下角的状态菜单。点一项跳到对应地址并重新加载；「暗色」可以和其他状态组合；「模拟」不重新加载。
{
  const groups = [
    ['首页', [['我的 chat', '/'], ['新建 chat', '/new'], ['用户菜单', '/', 'user-menu']]],
    ['聊天', [['默认', MAIN], ['输入中', MAIN, 'draft'], ['摘要生成中', MAIN, 'pending'], ['摘要生成失败', MAIN, 'failed'], ['还没有摘要', MAIN, 'nosummary'], ['邀请菜单', MAIN, 'invite'], ['更多菜单（创建者）', MAIN, 'more'], ['更多菜单（非创建者）', SIDE, 'more'], ['确认退出', MAIN, 'leave'], ['确认销毁', MAIN, 'destroy']]],
    ['仅 B 阅读', [['摘要展开', MAIN, 'summary-open'], ['显示已覆盖的消息', MAIN, 'covered'], ['参与者浮层', MAIN, 'people']]],
    ['仅 C 时间线', [['展开旧摘要 r2', MAIN, 'snap'], ['参与者标签', MAIN, 'tab-people'], ['信息与邀请标签', MAIN, 'tab-info'], ['收起侧栏', MAIN, 'nopanel']]],
    ['用户 token', [['列表', '/tokens'], ['生成', '/tokens', 'new-token'], ['只显示一次', '/tokens', 'token-shown'], ['确认吊销', '/tokens', 'revoke'], ['没有 token', '/tokens', 'tokens-empty']]],
    ['状态页', [['已销毁：空闲', '/c/c_8sQm1aZ0'], ['已销毁：创建者', '/c/c_Vb72Kd9e'], ['已销毁：到期', '/c/c_Mn3x0LqQ'], ['不存在', '/c/c_nope']]],
  ];
  const dark = has('dark');
  const curRoute = location.hash.slice(1).split('~')[0];
  const curFlags = flags.filter(f => f !== 'dark').join(',');
  const go = (r, f, d) => { const fl = [f, d ? 'dark' : ''].filter(Boolean).join(','); location.hash = r + (fl ? '~' + fl : ''); location.reload(); };
  const btn = document.createElement('button');
  btn.className = 'states-btn'; btn.innerHTML = icon('more') + '状态';
  const menu = document.createElement('div');
  menu.className = 'states'; menu.hidden = true;
  const add = (html, onclick, cur) => { const b = document.createElement('button'); b.innerHTML = html; if (cur) b.setAttribute('aria-current', 'true'); b.onclick = onclick; menu.append(b); return b; };
  const head = t => { const h = document.createElement('h4'); h.textContent = t; menu.append(h); };
  const t = add('暗色<span class="switch"></span>', () => go(curRoute, curFlags, !dark));
  t.className = 'toggle'; t.setAttribute('aria-pressed', dark);
  head('布局');
  for (const [v, n] of Object.entries(NAMES)) add(`${v} · ${n}<code>?variant=${v}</code>`, () => setVariant(v), v === S.variant);
  for (const [name, items] of groups) {
    head(name);
    for (const [label, r, f = ''] of items) add(`${label}<code>${f ? '~' + f : r.length > 12 ? r.slice(0, 12) + '…' : r}</code>`, () => go(r, f, dark), r === curRoute && f === curFlags);
  }
  head('模拟（不重新加载）');
  for (const [label, k] of [['Agent 发言', 'agent'], ['生成摘要', 'summary'], ['Agent 退出', 'agent-leave'], ['chat 被销毁', 'remote-destroy']]) add(label, () => { menu.hidden = true; simulate(k); });
  btn.onclick = e => {
    e.stopPropagation(); menu.hidden = !menu.hidden;
    if (!menu.hidden) menu.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });
  };
  menu.onclick = e => e.stopPropagation();
  document.addEventListener('click', () => { menu.hidden = true; });
  if (!navigator.webdriver) document.body.append(btn, menu);
}
</script>
