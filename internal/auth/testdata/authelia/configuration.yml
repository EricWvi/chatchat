# Authelia fixture for the contract test. The test fills in the port and
# the JWKS signing key placeholders; every secret here is test-only.
server:
  address: tcp://0.0.0.0:9091/
  tls:
    certificate: /config/tls-cert.pem
    key: /config/tls-key.pem
log:
  level: info
ntp:
  disable_startup_check: true
identity_validation:
  reset_password:
    jwt_secret: chatchat-test-reset-jwt-secret-only
authentication_backend:
  file:
    path: /config/users.yml
access_control:
  default_policy: one_factor
session:
  secret: chatchat-test-session-secret-not-for-production
  cookies:
    - domain: chatchat.test
      authelia_url: https://auth.chatchat.test:@PORT@
      default_redirection_url: https://chatchat.test
storage:
  encryption_key: chatchat-test-storage-encryption-key-only
  local:
    path: /config/db.sqlite3
notifier:
  filesystem:
    filename: /config/notifications.txt
identity_providers:
  oidc:
    hmac_secret: chatchat-test-oidc-hmac-secret-only
    jwks:
      - key_id: chatchat-test
        algorithm: RS256
        use: sig
        key: |
@SIGNING_KEY@
    clients:
      - client_id: chatchat
        client_name: chatchat Contract Test
        # homepage-test-client-secret
        client_secret: '$pbkdf2-sha512$310000$uO1NxWSZ6ADuhVHZb/sXxQ$afGQhLIRBpnBOVUoW7LMbAM8M9OOGuoqQSBHvx.8oZxTULw.QVmmuwGSW2R/NgrMBaMZ60txNyh4Qfs.PD7PfQ'
        public: false
        authorization_policy: one_factor
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://chatchat.test/auth/callback
        scopes:
          - openid
          - profile
          - email
        grant_types:
          - authorization_code
        response_types:
          - code
        token_endpoint_auth_method: client_secret_basic
